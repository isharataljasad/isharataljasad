<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img" aria-labelledby="sa-title">
  <title id="sa-title">A number line with P at negative three, Q at two and R at six. PQ measures five, QR measures four, and PR measures nine, so five plus four equals nine.</title>
  <!-- Type is sized for a phone: at 375px this 520-wide figure scales to about
       0.56, so 19 in the viewBox arrives near 10.6px. -->
  <defs>
    <marker id="sa-end" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#105c78"/></marker>
    <marker id="sa-start" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="#105c78"/></marker>
  </defs>

  <line x1="22" y1="170" x2="506" y2="170" stroke="#105c78" stroke-width="3" marker-start="url(#sa-start)" marker-end="url(#sa-end)"/>

  <!-- ticks at every integer from -5 to 8, 35px apart, -5 at x=40 -->
  <g stroke="#105c78" stroke-width="2">
    <line x1="40" y1="162" x2="40" y2="178"/><line x1="75" y1="162" x2="75" y2="178"/>
    <line x1="110" y1="162" x2="110" y2="178"/><line x1="145" y1="162" x2="145" y2="178"/>
    <line x1="180" y1="162" x2="180" y2="178"/><line x1="215" y1="155" x2="215" y2="185" stroke-width="3"/>
    <line x1="250" y1="162" x2="250" y2="178"/><line x1="285" y1="162" x2="285" y2="178"/>
    <line x1="320" y1="162" x2="320" y2="178"/><line x1="355" y1="162" x2="355" y2="178"/>
    <line x1="390" y1="162" x2="390" y2="178"/><line x1="425" y1="162" x2="425" y2="178"/>
    <line x1="460" y1="162" x2="460" y2="178"/><line x1="495" y1="162" x2="495" y2="178"/>
  </g>
  <g fill="#153748" font-size="19" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="40" y="203">−5</text><text x="75" y="203">−4</text><text x="110" y="203">−3</text>
    <text x="145" y="203">−2</text><text x="180" y="203">−1</text>
    <text x="215" y="203" font-weight="700">0</text>
    <text x="250" y="203">1</text><text x="285" y="203">2</text><text x="320" y="203">3</text>
    <text x="355" y="203">4</text><text x="390" y="203">5</text><text x="425" y="203">6</text>
    <text x="460" y="203">7</text><text x="495" y="203">8</text>
  </g>

  <!-- the three named points -->
  <g stroke="#fff" stroke-width="2.5">
    <circle cx="110" cy="170" r="8" fill="#ad6421"/>
    <circle cx="285" cy="170" r="8" fill="#10766f"/>
    <circle cx="425" cy="170" r="8" fill="#7a3f9d"/>
  </g>
  <g font-size="21" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">
    <text x="110" y="152" fill="#ad6421">P</text>
    <text x="285" y="152" fill="#10766f">Q</text>
    <text x="425" y="152" fill="#7a3f9d">R</text>
  </g>

  <!-- the two parts, above -->
  <path d="M110 118 H285" fill="none" stroke="#ad6421" stroke-width="2.4"/>
  <path d="M110 112 V124 M285 112 V124" stroke="#ad6421" stroke-width="2.4"/>
  <text x="197" y="104" fill="#ad6421" font-size="19" text-anchor="middle" font-family="system-ui, sans-serif">PQ = 5</text>

  <path d="M285 118 H425" fill="none" stroke="#10766f" stroke-width="2.4"/>
  <path d="M425 112 V124" stroke="#10766f" stroke-width="2.4"/>
  <text x="355" y="104" fill="#10766f" font-size="19" text-anchor="middle" font-family="system-ui, sans-serif">QR = 4</text>

  <!-- the whole, below -->
  <path d="M110 232 H425" fill="none" stroke="#7a3f9d" stroke-width="2.4"/>
  <path d="M110 226 V238 M425 226 V238" stroke="#7a3f9d" stroke-width="2.4"/>
  <text x="267" y="222" fill="#7a3f9d" font-size="19" text-anchor="middle" font-family="system-ui, sans-serif">PR = 9, and 5 + 4 = 9</text>

  <text x="267" y="72" fill="#566977" font-size="19" text-anchor="middle" font-family="system-ui, sans-serif">each length is |difference of coordinates|</text>
</svg>
