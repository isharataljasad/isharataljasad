<section class="model-explorer" aria-label="Explore the vertical-line test"><div class="graph-pair"><svg viewBox="0 0 340 290" role="img" aria-label="Parabola y equals x squared over two, with one output for each input."><path d="M30 150H310 M170 250V25" fill="none" stroke="#a3b8c3" stroke-width="1.5"/><g fill="#153748" font-size="19"><text x="55" y="280">Parabola: y = x²/2</text><text x="294" y="173">x</text><text x="180" y="32">y</text></g><path d="M74 54 Q170 246 266 54" fill="none" stroke="#105c78" stroke-width="4"/><line id="parabola-scan" x1="170" y1="30" x2="170" y2="250" stroke="#ad6421" stroke-width="2" stroke-dasharray="7 5"/><circle id="parabola-hit" cx="170" cy="150" r="7" fill="#10766f" stroke="white" stroke-width="2"/></svg><svg viewBox="0 0 340 290" role="img" aria-label="Circle x squared plus y squared equals four. At x equals zero, two outputs occur."><path d="M30 150H310 M170 255V25" fill="none" stroke="#a3b8c3" stroke-width="1.5"/><g fill="#153748" font-size="19"><text x="50" y="280">Circle: x² + y² = 4</text><text x="294" y="173">x</text><text x="180" y="32">y</text></g><circle cx="170" cy="150" r="96" fill="none" stroke="#105c78" stroke-width="4"/><line id="circle-scan" x1="170" y1="30" x2="170" y2="265" stroke="#ad6421" stroke-width="2" stroke-dasharray="7 5"/><g fill="#10766f" stroke="white" stroke-width="2"><circle id="circle-hit-0" cx="170" cy="246" r="7"/><circle id="circle-hit-1" cx="170" cy="54" r="7"/></g></svg></div><label for="graph-input">Move the input x: <output id="graph-value" for="graph-input">0.0</output></label><input type="range" id="graph-input" min="-2" max="2" step="0.1" value="0"><p id="graph-feedback" role="status">At x = 0, the parabola has one output; the circle has two. The circle is not the graph of a function of x.</p><p>A function must pass at every input. Testing one line alone cannot establish that a whole graph is a function.</p><noscript>The static picture shows the test at x = 0. The slider requires JavaScript.
