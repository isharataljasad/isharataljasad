<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 245" role="img" aria-labelledby="title description">
  <title id="title">Inputs and outputs in a function</title>
  <desc id="description">On the left, inputs negative one and three both lead to output four, which is a function. On the right, input zero leads to outputs two and five, which is not a function.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#10766f"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#ad5b46"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="243" rx="12" fill="#f8fbfc" stroke="#d4e1e7"/>
  <path d="M360 16 V229" stroke="#d4e1e7" stroke-width="2"/>
  <text x="27" y="37" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#153748">Function</text>
  <text x="387" y="37" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#153748">Not a function</text>
  <text x="28" y="61" font-family="Arial, sans-serif" font-size="13" fill="#566f7a">Two inputs may share one output</text>
  <text x="388" y="61" font-family="Arial, sans-serif" font-size="13" fill="#566f7a">One input cannot have two outputs</text>
  <path d="M100 109 C158 109 196 145 258 145" fill="none" stroke="#10766f" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M100 181 C158 181 196 145 258 145" fill="none" stroke="#10766f" stroke-width="3" marker-end="url(#arrow-green)"/>
  <circle cx="75" cy="109" r="24" fill="#e5f3f0" stroke="#10766f" stroke-width="2"/>
  <circle cx="75" cy="181" r="24" fill="#e5f3f0" stroke="#10766f" stroke-width="2"/>
  <circle cx="283" cy="145" r="24" fill="#e5f3f0" stroke="#10766f" stroke-width="2"/>
  <text x="75" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#153748">−1</text>
  <text x="75" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#153748">3</text>
  <text x="283" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#153748">4</text>
  <path d="M459 145 C516 145 555 109 612 109" fill="none" stroke="#ad5b46" stroke-width="3" marker-end="url(#arrow-red)"/>
  <path d="M459 145 C516 145 555 181 612 181" fill="none" stroke="#ad5b46" stroke-width="3" marker-end="url(#arrow-red)"/>
  <circle cx="434" cy="145" r="24" fill="#fbebe6" stroke="#ad5b46" stroke-width="2"/>
  <circle cx="637" cy="109" r="24" fill="#fbebe6" stroke="#ad5b46" stroke-width="2"/>
  <circle cx="637" cy="181" r="24" fill="#fbebe6" stroke="#ad5b46" stroke-width="2"/>
  <text x="434" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#153748">0</text>
  <text x="637" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#153748">2</text>
  <text x="637" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#153748">5</text>
</svg>
