<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>بلّغوا عني ولو آية · مسار الفؤاد للتدبر · بيت الفؤاد</title>
  <meta name="description" content="مسار الفؤاد للتدبر من بيت الفؤاد — الأحزاب الثمانية الأولى في تجربة عربية هادئة تحفظ كتابتك واختياراتك على جهازك." />
  <meta name="theme-color" content="#0b1712" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <link rel="canonical" href="https://www.isharataljasad.com/" />
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/tadabbur/style.css" />
</head>
<body data-scale="md">
  <a class="skip-link" href="#app">تخطَّ إلى المحتوى</a>

  <header class="topbar">
    <a class="brand" href="https://baytalfuad.com/" aria-label="العودة إلى بيت الفؤاد">
      <span class="mark" aria-hidden="true">ف</span>
      <span class="brand-copy">
        <b>بلّغوا عني ولو آية</b>
        <small>مسار الفؤاد للتدبر · من بيت الفؤاد</small>
      </span>
    </a>
    <button id="menuBtn" class="menu-btn" type="button" aria-expanded="false" aria-controls="sideNav">
      <span aria-hidden="true">☰</span><span class="sr-only">القائمة</span>
    </button>
  </header>

  <div class="shell">
    <aside id="sideNav" class="side-nav" aria-label="أقسام مسار التدبر">
      <nav>
        <button class="nav is-active" data-view="encounter" type="button">اللقاء</button>
        <button class="nav" data-view="written" type="button">ما كتبتُه</button>
        <button class="nav" data-view="chosen" type="button">ما اخترتُه</button>
        <button class="nav" data-view="return" type="button">العودة</button>
        <div class="nav-divider"></div>
        <button class="nav" data-view="hizbs" type="button">الأحزاب</button>
      </nav>

      <div class="side-tools">
        <label for="scaleSel">حجم النص</label>
        <select id="scaleSel">
          <option value="md">عادي</option>
          <option value="lg">أكبر</option>
          <option value="xl">الأكبر</option>
        </select>
        <button class="tool-btn" id="exportBtn" type="button">تصدير نسخة من سجلي</button>
        <label class="tool-btn" for="importRecord">استيراد سجلي السابق</label><input id="importRecord" type="file" accept="application/json" hidden /><button class="tool-btn danger" id="eraseBtn" type="button">مسح بياناتي من هذا الجهاز</button>
        <a class="tool-btn home-link" href="https://baytalfuad.com/">العودة إلى بيت الفؤاد</a>
      </div>
    </aside>

    <main id="app" class="content" tabindex="-1" aria-live="polite">
      <section class="loading-card">جارٍ تجهيز مسار التدبر…</section>
    </main>
  </div>

  <footer class="site-footer">
    <span>بيت الفؤاد · مسار الفؤاد للتدبر</span>
    <span>الدقة قبل البلاغة</span>
  </footer>

  <dialog id="confirmDlg">
    <form method="dialog" class="dialog-card">
      <h2>مسح السجل المحلي</h2>
      <p>سيُحذف ما كتبته وما اخترته على هذا الجهاز فقط. نصوص الأحزاب لن تتأثر.</p>
      <div class="dialog-actions">
        <button value="cancel" class="btn secondary">إلغاء</button>
        <button value="confirm" class="btn danger-solid">مسح السجل</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/tadabbur/app.js"></script>
  <noscript><p class="noscript">هذه الصفحة تحتاج إلى تفعيل JavaScript لعرض البطاقات.</p></noscript>
</body>
</html>
