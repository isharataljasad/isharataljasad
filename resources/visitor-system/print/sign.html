@page{size:A4 portrait;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FBF7EF;--ink:#1C1915;--ink2:#3A342C;--gold:#B08A45;--gold2:#D6BE8A}
html,body{width:210mm;height:297mm;background:var(--bg)}

.page{position:relative;width:210mm;height:297mm;background:var(--bg)}
.f1{position:absolute;inset:12mm;border:0.55mm solid var(--gold)}
.f2{position:absolute;inset:14mm;border:0.2mm solid var(--gold2)}
.c{position:absolute;inset:20mm 22mm;display:flex;flex-direction:column;align-items:center;text-align:center}
.school{font-weight:700;font-size:19pt;line-height:1.5;margin-top:6mm}
.rule{width:52mm;height:0.35mm;background:var(--gold);margin:8mm 0 9mm}
.welcome{font-weight:800;font-size:34pt;line-height:1.35}
.title{font-weight:700;font-size:20pt;line-height:1.5;margin-top:3mm;color:var(--ink2)}
.scan{font-weight:500;font-size:17pt;line-height:1.5;margin-top:7mm}
.qr{margin-top:8mm;background:#fff;padding:7mm;border:0.3mm solid var(--gold2)}
.qr svg{display:block;width:96mm;height:96mm}
.leave{margin-top:9mm}
.leave b{display:block;font-weight:800;font-size:17pt;line-height:1.5}
.leave span{display:block;font-weight:500;font-size:15pt;line-height:1.6}
.leave small{display:block;font-weight:500;font-size:13pt;line-height:1.6;color:var(--ink2);margin-top:1mm}
.thanks{margin-top:auto;font-weight:700;font-size:20pt;line-height:1.5;margin-bottom:3mm}
.thanks::before{content:"";display:block;width:30mm;height:0.35mm;background:var(--gold);margin:0 auto 5mm}
